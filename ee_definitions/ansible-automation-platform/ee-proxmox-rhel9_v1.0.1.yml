---
# =============================================================================
# EE: ee-proxmox-rhel9  (version comes from the filename)
# Purpose : Dynamic Proxmox inventory
# Notes   : Was tagged 2.17 (the ansible-core version) in the original repo.
# Origin  : lennysh-aap-execution-environments/vars/ansible-automation-platform/ee-proxmox-rhel9/vars.yml
# =============================================================================
description: Dynamic Proxmox inventory

# Registry/namespace to push to. Image = <destination>/<ee-name>:<version>
destination: quay.io/lshirley/ansible-automation-platform

base_image: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.17

dependencies:
  galaxy:
    collections:
      - name: community.proxmox
  # Build-only: compile C extensions if any Python dependency needs it.
  # Tagged "compile" so they stay OUT of the final image.
  # python3.X-devel must match the Python the EE runs (3.11 in the :2.17 base image).
  system:
    - "python3.11-devel [platform:rpm compile]"
    - "pkg-config [platform:rpm compile]"
    - "systemd-devel [platform:rpm compile]"
    - "gcc [platform:rpm compile]"

build_steps:
  append_final:
    # tzdata: current ee-minimal images already ship full zoneinfo, and
    # "microdnf reinstall tzdata" now fails the build, so it was removed in v1.0.1.
    - RUN microdnf clean all
...
