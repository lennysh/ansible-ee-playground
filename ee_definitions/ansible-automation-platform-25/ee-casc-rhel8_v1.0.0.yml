---
# =============================================================================
# EE: ee-casc-rhel8  (version comes from the filename)
# Purpose : Config as Code for AAP 2.5
# Origin  : lennysh-aap-execution-environments/vars/ansible-automation-platform-25/ee-casc-rhel8/vars.yml
# =============================================================================
description: Config as Code for AAP 2.5

# Registry/namespace to push to. Image = <destination>/<ee-name>:<version>
destination: quay.io/lshirley/ansible-automation-platform-25

base_image: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel8:2.16

dependencies:
  galaxy:
    collections:
      - name: infra.aap_configuration
      - name: infra.aap_configuration_extended
      - name: ansible.controller
        version: ">=4.6,<4.7"
      - name: ansible.platform
        version: ">=2.5,<2.6"
      - name: ansible.eda
      - name: ansible.hub
  # Build tools for Python packages with C extensions pulled in by collections
  system:
    - "python3.11-devel [platform:rpm]"
    - "pkg-config [platform:rpm]"
    - "systemd-devel [platform:rpm]"
    - "gcc [platform:rpm]"

build_steps:
  append_final:
    - RUN microdnf reinstall tzdata -y   # ee-minimal strips zoneinfo; needed for schedules
    - RUN microdnf clean all
    # - RUN curl -L -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/local/bin/yq
...
