---
# =============================================================================
# EE: ee-aap-self-service-portal-rhel9  (version comes from the filename)
# Purpose : AAP Self-Service Portal (AAP 2.6)
# Origin  : lennysh-aap-execution-environments/vars/ansible-automation-platform-26/ee-aap-self-service-portal-rhel9/vars.yml
# =============================================================================
description: AAP Self-Service Portal (AAP 2.6)

# Registry/namespace to push to. Image = <destination>/<ee-name>:<version>
destination: quay.io/lshirley/ansible-automation-platform-26

base_image: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.16

dependencies:
  galaxy:
    collections:
      - name: ansible.platform
      - name: redhat.openshift
      - name: kubernetes.core
      - name: https://github.com/lennysh/lennysh.aap_self_service_portal.git
        type: git
        version: devel
  python:
    - "kubernetes>=33.0.0"
    - "openshift>=0.13.0"
    - "requests>=2.25.0"
    - "urllib3>=1.26.0"
    - "PyYAML>=5.4.0"
  # Build tools for Python packages with C extensions pulled in by collections
  system:
    - "python3.11-devel [platform:rpm]"
    - "pkg-config [platform:rpm]"
    - "systemd-devel [platform:rpm]"
    - "gcc [platform:rpm]"

build_steps:
  append_final:
    - RUN microdnf reinstall tzdata -y   # ee-minimal strips zoneinfo; needed for schedules
    - RUN microdnf clean all
...
